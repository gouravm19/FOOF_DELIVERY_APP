global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'food-delivery-platform'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'user-service:8081'
        - 'restaurant-service:8082'
        - 'order-service:8083'
        - 'payment-service:8084'
        - 'delivery-service:8085'
        - 'notification-service:8086'
        - 'search-service:8087'
        - 'api-gateway:8080'
        - 'eureka-server:8761'
        - 'config-server:8888'
    labels:
      application: 'food-delivery'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']